<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./imgs/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64">
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="styles.css">
    <title>Theme Clock</title>
</head>
<body>
    <button class="toggle">Dark mode</button>

    <div class="clock-container">
        <div class="clock">
            <div class="needle hour"></div>
            <div class="needle minute"></div>
            <div class="needle second"></div>
            <div class="center-point"></div>
        </div>

        <div class="time">04:20</div>
        <div class="date">Monday, Nov <span class="circle">2</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
