<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./imgs/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="styles.css">
    <title>Drawing Pad UI</title>
</head>
<body>
    <canvas id="canvas" width="800" height="800" style="background: #eee;"></canvas>
    <div class="toolbox">
        <button id="decrease">-</button>
        <span id="size">20</span>
        <button id="increase">+</button>
        <input type="color" id="color">
        <button id="clear">X</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
