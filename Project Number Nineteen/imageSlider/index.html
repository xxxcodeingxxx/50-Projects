<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/favicon.ico">
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
    <script src="https://kit.fontawesome.com/64cab7dd3d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Image Slider</title>
</head>
<body>
    <div class="slider-container">
        <div class="slide active" style="background-image: url('https://plus.unsplash.com/premium_photo-1794579513569-3feaacfdd656?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');"></div>
        <div class="slide" style="background-image: url('https://plus.unsplash.com/premium_photo-1692745873484-89b063770f50?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1639746292626-690a884030b5?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');"></div>
        <div class="slide" style="background-image: url('https://plus.unsplash.com/premium_photo-1694607586811-eb9a00f84380?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1551370171-b80c1c4fdcf6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');"></div>
        <button class="arrow left-arrow" id="left">
            <i class="fas fa-arrow-left"></i>
        </button>
        <button class="arrow right-arrow" id="right">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
