<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/imgs/counter-favicon-v2.svg">
    <script src="https://kit.fontawesome.com/64cab7dd3d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Increment Counter App</title>
</head>
<body id="body">
    <div class="buttons">
        <button class="btn" id="dark"><i class="fa-solid fa-moon fa-3x"></i></button>
        <button class="btn" id="light"><i class="fa-solid fa-sun fa-3x"></i></button>
    </div>
    <div class="counter-container" id="topDog">
        <i class="fab fa-twitter fa-3x"></i>
        <div class="counter" data-target="12000"></div>
        <span>Twitter Followers</span>
    </div>
    <div class="counter-container">
        <i class="fab fa-youtube fa-3x"></i>
        <div class="counter" data-target="5000"></div>
        <span>YouTube Subscribers</span>
    </div>
    <div class="counter-container">
        <i class="fab fa-facebook fa-3x"></i>
        <div class="counter" data-target="7500"></div>
        <span>Facebook Fans</span>
    </div>
    <div class="counter-container" id="last">
        <i class="fab fa-instagram fa-3x"></i>
        <div class="counter" data-target="96000"></div>
        <span>Instagram Lurkers</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
