<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Random Choice Picker</title>
</head>
<body>
    <div class="container">
        <div class="wrap">
            <div class="div-1">
                <p>
                    Enter all of the choices divided by a comma (',').
                    Press enter when you're done.
                </p>
            </div>
            <div class="div-2">
                <textarea name="Random" id="random"></textarea>
            </div>
            <div class="div-2">
                <button class="btn btn-1">Choice 1</button>
                <button class="btn btn-2">Choice 2</button>
                <button class="btn btn-3">Choice 3</button>
                <button class="btn btn-4">Choice 4</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
