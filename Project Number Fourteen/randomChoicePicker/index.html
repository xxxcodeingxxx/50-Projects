<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/imgs/random-choice-favicon-v3.svg">
    <title>Random Choice Picker</title>
</head>
<body>
    <div class="container">
        <div class="wrap">
            <div class="div-1">
                <p class="txt">
                    Enter all of the choices divided by a comma (',').<br>
                    Press enter when you're done.
                </p>
            </div>
            <div class="div-2">
                <textarea placeholder="Enter text here..." name="Random" id="random"></textarea>
            </div>
            <div id="tags" class="div-2">
                
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
